<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>

  <!-- internet side -->
  <text x="24" y="32" font-size="12" font-weight="600" fill="#52606d" letter-spacing=".06em">INTERNET</text>
  <rect x="24" y="48" width="170" height="70" rx="10" fill="#f0f7f3" stroke="#2f6f4f"/>
  <text x="109" y="78" text-anchor="middle" font-weight="600" fill="#1f2933">Visitor's browser</text>
  <text x="109" y="98" text-anchor="middle" fill="#52606d">form + live status page</text>

  <rect x="24" y="150" width="170" height="56" rx="10" fill="#fff" stroke="#9aa5b1" stroke-dasharray="4 3"/>
  <text x="109" y="174" text-anchor="middle" font-weight="600" fill="#1f2933">Cloudflare Tunnel</text>
  <text x="109" y="193" text-anchor="middle" fill="#52606d">n8n.kabiirlabs.com</text>
  <line x1="109" y1="118" x2="109" y2="148" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- host box -->
  <rect x="230" y="20" width="706" height="520" rx="14" fill="#fafbfc" stroke="#cbd2d9"/>
  <text x="248" y="44" font-size="12" font-weight="600" fill="#52606d" letter-spacing=".06em">SELF-HOSTED (DOCKER COMPOSE)</text>

  <rect x="250" y="140" width="190" height="96" rx="10" fill="#fff" stroke="#1f2933"/>
  <text x="345" y="164" text-anchor="middle" font-weight="600" fill="#1f2933">Gateway  :5678</text>
  <text x="345" y="184" text-anchor="middle" fill="#52606d">pages, /api/lead, /api/status</text>
  <text x="345" y="202" text-anchor="middle" fill="#52606d">IP rate limit, CSP, 16 KB cap</text>
  <text x="345" y="222" text-anchor="middle" fill="#b42318">everything else: 404</text>
  <line x1="194" y1="178" x2="248" y2="178" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="250" y="270" width="180" height="62" rx="10" fill="#fff" stroke="#9aa5b1"/>
  <text x="340" y="294" text-anchor="middle" font-weight="600" fill="#1f2933">n8n editor  :5680</text>
  <text x="340" y="314" text-anchor="middle" fill="#52606d">loopback only, owner login</text>

  <!-- n8n intake -->
  <rect x="470" y="60" width="446" height="380" rx="12" fill="#fff" stroke="#ea4b71"/>
  <text x="488" y="84" font-weight="700" fill="#ea4b71">n8n 2.45.7 · workflow "Lead pipeline: intake"</text>

  <g font-size="12.5">
    <rect x="488" y="100" width="190" height="34" rx="7" fill="#f5f7fa" stroke="#cbd2d9"/><text x="498" y="122" fill="#1f2933">1 Validate + spam guard</text>
    <rect x="700" y="100" width="198" height="34" rx="7" fill="#f5f7fa" stroke="#cbd2d9"/><text x="710" y="122" fill="#1f2933">2 Rate limits (data table)</text>
    <rect x="488" y="148" width="190" height="34" rx="7" fill="#eaf6ee" stroke="#2f6f4f"/><text x="498" y="170" fill="#1f2933">3 Save + answer 202</text>
    <rect x="700" y="148" width="198" height="34" rx="7" fill="#f5f7fa" stroke="#cbd2d9"/><text x="710" y="170" fill="#1f2933">4 Gemini: score (JSON schema)</text>
    <rect x="488" y="196" width="190" height="34" rx="7" fill="#f5f7fa" stroke="#cbd2d9"/><text x="498" y="218" fill="#1f2933">5 Contract check / fallback</text>
    <rect x="700" y="196" width="198" height="34" rx="7" fill="#f5f7fa" stroke="#cbd2d9"/><text x="710" y="218" fill="#1f2933">6 HubSpot: upsert contact</text>
    <rect x="488" y="244" width="190" height="34" rx="7" fill="#f5f7fa" stroke="#cbd2d9"/><text x="498" y="266" fill="#1f2933">7 HubSpot: note on contact</text>
    <rect x="700" y="244" width="198" height="34" rx="7" fill="#f5f7fa" stroke="#cbd2d9"/><text x="710" y="266" fill="#1f2933">8 Resend: reply to lead</text>
    <rect x="488" y="292" width="190" height="34" rx="7" fill="#f5f7fa" stroke="#cbd2d9"/><text x="498" y="314" fill="#1f2933">9 Resend: team alert</text>
    <rect x="700" y="292" width="198" height="34" rx="7" fill="#f5f7fa" stroke="#cbd2d9"/><text x="710" y="314" fill="#1f2933">10 Log "done" + outcome</text>
  </g>
  <text x="488" y="352" fill="#52606d" font-size="12">Every step writes an event row to the lead_events data table.</text>
  <text x="488" y="370" fill="#52606d" font-size="12">Each outside call: 3 tries, 2 s apart, timeout, error output wired.</text>

  <rect x="488" y="384" width="410" height="42" rx="7" fill="#fff4ed" stroke="#c2410c"/>
  <text x="498" y="402" fill="#9a3412" font-size="12">Error branch: failed step → urgent team alert with the full lead.</text>
  <text x="498" y="419" fill="#9a3412" font-size="12">Alert itself fails → execution fails → Error Workflow emails the team.</text>

  <line x1="440" y1="170" x2="486" y2="140" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="446" y="140" fill="#52606d" font-size="11">POST</text>
  <path d="M440 222 H455 V489 H486" fill="none" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="459" y="250" fill="#52606d" font-size="11" transform="rotate(90 459 250)">GET status</text>

  <rect x="488" y="456" width="200" height="66" rx="10" fill="#fff" stroke="#ea4b71"/>
  <text x="588" y="480" text-anchor="middle" font-weight="600" fill="#1f2933">"Lead pipeline: status"</text>
  <text x="588" y="500" text-anchor="middle" fill="#52606d">events → public timeline</text>
  <text x="588" y="515" text-anchor="middle" fill="#52606d" font-size="11.5">(masked email, no message)</text>

  <rect x="708" y="456" width="208" height="66" rx="10" fill="#fff" stroke="#ea4b71"/>
  <text x="812" y="480" text-anchor="middle" font-weight="600" fill="#1f2933">Data tables (SQLite)</text>
  <text x="812" y="500" text-anchor="middle" fill="#52606d">pipeline_leads · lead_events</text>
  <text x="812" y="515" text-anchor="middle" fill="#52606d" font-size="11.5">email stored only as a hash</text>

  <!-- outside services -->
  <text x="24" y="262" font-size="12" font-weight="600" fill="#52606d" letter-spacing=".06em">OUTSIDE SERVICES</text>
  <rect x="24" y="276" width="170" height="40" rx="8" fill="#fff" stroke="#9aa5b1"/><text x="109" y="301" text-anchor="middle" fill="#1f2933">Google Gemini API</text>
  <rect x="24" y="326" width="170" height="40" rx="8" fill="#fff" stroke="#9aa5b1"/><text x="109" y="351" text-anchor="middle" fill="#1f2933">HubSpot CRM (free)</text>
  <rect x="24" y="376" width="170" height="40" rx="8" fill="#fff" stroke="#9aa5b1"/><text x="109" y="401" text-anchor="middle" fill="#1f2933">Resend email API</text>
  <path d="M486 405 C 400 470, 280 440, 196 352" fill="none" stroke="#52606d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="248" y="500" fill="#52606d" font-size="11.5">n8n calls these over HTTPS;</text>
  <text x="248" y="516" fill="#52606d" font-size="11.5">keys live in n8n's encrypted</text>
  <text x="248" y="532" fill="#52606d" font-size="11.5">credential store</text>
</svg>
